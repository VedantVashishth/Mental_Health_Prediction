<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mental Health Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

<!-- ========================= -->
<!-- Animated Background -->
<!-- ========================= -->

<div class="background">

    <div class="gradient"></div>

    <div class="grid"></div>

    <div class="particles" id="particles"></div>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

</div>

<!-- ========================= -->
<!-- HERO -->
<!-- ========================= -->

<section class="hero">

    <div class="hero-content">

        <h1>Mental Health Prediction</h1>

        <p>Understand your digital habits through AI.</p>

        <button id="startBtn">

            Start Assessment
            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

</section>

<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<section class="container">

    <div class="glass-card">

        <!-- Progress -->

        <div class="progress-container">

            <div class="progress-bar">

                <div class="progress-fill" id="progressFill"></div>

            </div>

            <span id="progressText">
                Step 1 of 4
            </span>

        </div>

        <!-- ===================== -->
        <!-- FORM -->
        <!-- ===================== -->

        <form id="predictionForm">

            <!-- ===================== -->
            <!-- STEP 1 -->
            <!-- ===================== -->

            <div class="step active">

                <h2>Personal Information</h2>

                <div class="input-group">

                    <label>Age</label>

                    <input
                        type="number"
                        id="age"
                        required>

                </div>

                <div class="input-group">

                    <label>Gender</label>

                    <select id="gender">

                        <option>Male</option>
                        <option>Female</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Country</label>

                    <input
                        type="text"
                        id="country"
                        placeholder="India">

                </div>

            </div>

            <!-- ===================== -->
            <!-- STEP 2 -->
            <!-- ===================== -->

            <div class="step">

                <h2>Education</h2>

                <div class="input-group">

                    <label>Academic Level</label>

                    <select id="academic_level">

                        <option>Undergraduate</option>
                        <option>Graduate</option>
                        <option>High School</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Study Hours</label>

                    <input
                        type="number"
                        step="0.1"
                        id="study_hours">

                </div>

            </div>

            <!-- ===================== -->
            <!-- STEP 3 -->
            <!-- ===================== -->

            <div class="step">

                <h2>Digital Lifestyle</h2>

                <div class="input-group">

                    <label>Most Used Platform</label>

                    <select id="most_used_platform">

                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>LinkedIn</option>
                        <option>Snapchat</option>
                        <option>Twitter</option>
                        <option>YouTube</option>
                        <option>TikTok</option>
                        <option>LINE</option>
                        <option>KakaoTalk</option>
                        <option>VKontakte</option>
                        <option>WhatsApp</option>
                        <option>WeChat</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Purpose</label>

                    <select id="purpose_of_use">

                        <option>Networking</option>
                        <option>Education</option>
                        <option>Entertainment</option>
                        <option>News</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>Daily Usage (Hours)</label>

                    <input
                        type="number"
                        step="0.1"
                        id="avg_daily_usage_hours">

                </div>

                <div class="input-group">

                    <label>Daily Unlocks</label>

                    <input
                        type="number"
                        id="daily_unlocks">

                </div>

            </div>

            <!-- ===================== -->
            <!-- STEP 4 -->
            <!-- ===================== -->

            <div class="step">

                <h2>Health</h2>

                <div class="input-group">

                    <label>Physical Activity</label>

                    <input
                        type="number"
                        step="0.1"
                        id="physical_activity_hours">

                </div>

                <div class="input-group">

                    <label>Sleep Hours</label>

                    <input
                        type="number"
                        step="0.1"
                        id="sleep_hours_per_night">

                </div>

                <div class="input-group">

                    <label>Stress Level</label>

                    <select id="stress_level">

                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Very High</option>

                    </select>

                </div>

            </div>

            <!-- Navigation -->

            <div class="buttons">

                <button
                    type="button"
                    id="prevBtn">

                    Previous

                </button>

                <button
                    type="button"
                    id="nextBtn">

                    Next

                </button>

                <button
                    type="submit"
                    id="submitBtn">

                    Predict

                </button>

            </div>

        </form>

    </div>

</section>

<!-- ========================= -->
<!-- Loading Screen -->
<!-- ========================= -->

<div class="loading-screen" id="loadingScreen">

    <div class="loader">

        <div class="ring"></div>

        <div class="ring"></div>

        <div class="ring"></div>

    </div>

    <h2 id="loadingText">

        Analyzing your digital behavior...

    </h2>

</div>

<!-- ========================= -->
<!-- RESULT -->
<!-- ========================= -->

<section
    class="result-section"
    id="resultSection">

    <div class="glass-card result-card">

        <h2>Your Mental Health Score</h2>

        <div class="circle">

            <svg>

                <circle
                    cx="110"
                    cy="110"
                    r="95">
                </circle>

                <circle
                    id="progressCircle"
                    cx="110"
                    cy="110"
                    r="95">
                </circle>

            </svg>

            <div class="score">

                <span id="scoreValue">

                    0.00

                </span>

                <small>/10</small>

            </div>

        </div>

        <h3 id="scoreTitle"></h3>

        <p id="scoreDescription"></p>

    </div>

</section>

<!-- ========================= -->
<!-- VIDEO MODAL -->
<!-- ========================= -->

<div
    class="modal"
    id="videoModal">

    <div class="modal-content">

        <h2>✨ A Message For You</h2>

        <p id="videoMessage">

            Keep moving forward.
            Every step matters.

        </p>

        <button id="watchVideo">

            <i class="fa-solid fa-play"></i>

            Watch Now

        </button>

        <button id="closeModal">

            Maybe Later

        </button>

    </div>

</div>

<!-- ========================= -->
<!-- Toast -->
<!-- ========================= -->

<div
    id="toast"
    class="toast">

</div>

<script src="/static/script.js"></script>

</body>
</html>
